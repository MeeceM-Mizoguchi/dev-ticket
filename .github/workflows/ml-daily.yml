# ENHA2-034 毎日の自動更新（夜間・JST）
#
# 毎晩、誰も使っていない時間帯に無人で走る。ユーザーのログインは不要で、
# 「学習ボタン」を押す必要もない。
#
# ★①→②を必ずこの順で直列に実行する★
#   ② モデル学習は、① スキル分析が出したスキル・レベルを学習材料にする。
#   別々の仕組みで並行起動すると、②が古いスキルで学習してしまう。
#
# ★差分検知★
#   前回から変更のない組織は①も②もスキップされる。1000組織あっても、
#   昨日チケットが動いたのは一部だけなので、日次でも実質的な負荷は軽い。
#
# ★実行結果を必ず ml_batch_runs に残す★
#   ①が308で素通りしていた7/14〜7/31、ワークフローは緑のままで2週間誰も気付けなかった。
#   ②に至っては一度も学習に成功していないのに、それも緑だった。
#   結果をDBに残し、アプリの「学習ログ」タブから見えるようにしている。
#
# なぜ学習(②)が Vercel cron ではなく GitHub Actions か:
#   LightGBM/numpy はサーバレス関数のバンドルサイズ上限にとって重すぎる。
#   毎日1回・数分でよい処理なので、実行環境の制約が緩いこちらに置く。
#
# 必要な Secrets:
#   APP_URL                    … 例 https://dev-ticket.vercel.app（末尾スラッシュなし）
#   CRON_SECRET                … Vercel 側の環境変数と同じ値
#   VITE_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY  … RLSをバイパスするため service_role が必要

name: ML daily (nightly JST)

on:
  schedule:
    # cron は UTC。
    #
    # ★約1時間前倒ししてある★
    #   GitHub の schedule は best-effort で、毎時0分は負荷が集中して大きく遅れる。
    #   実測（#1〜#17）では "0 18" 指定に対して +56〜+98分（中央値 +66分）遅れており、
    #   狙った 03:00 JST に一度も走らず、毎回 03:56〜04:38 JST に着地していた。
    #   16:45 UTC (=01:45 JST) 指定なら、同じ遅延幅でも 02:41〜03:23 JST に収まる。
    - cron: "45 16 * * *"
  workflow_dispatch:  # 「今すぐ再学習」から手動起動できるようにする
    inputs:
      org:
        description: "この組織だけ学習する（空なら全組織）"
        required: false
      force:
        description: "変更が無くても学習する"
        required: false
        default: "false"

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ★①(TypeScript/Vercel) と ②(Python/ここ) を1つの学習ログ行に紐づける鍵★
      #   別プロセスなので、GitHub の run_id を共通キーにして同じ行を更新していく。
      BATCH_ID: "${{ github.run_id }}-${{ github.run_attempt }}"
      TRIGGER: "daily"
    steps:
      - uses: actions/checkout@v4

      # ── 週に1回は差分検知を無視して全件やり直す ──
      # 差分検知は「チケットが動いたか」しか見ていない。スキルマスタの変更や、
      # 判定ロジック自体の変更は検知できないため、放っておくと古い判定が残り続ける。
      # 日曜(JST)だけ force にして、取りこぼしを自動的に修復する。
      - name: Decide force flag
        id: force
        run: |
          MANUAL="${{ github.event.inputs.force }}"
          # JST の曜日（1=月 … 7=日）
          DOW=$(TZ=Asia/Tokyo date +%u)
          if [ "$MANUAL" = "true" ] || [ "$DOW" = "7" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "週次のフル再計算として force で実行します（JST曜日=$DOW）"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      # ── ① スキル自動分析（全組織）── 先に必ずこれ
      # 実績 → メンバーのスキル・レベルを更新し、あわせてチケットの必要スキルを自動付与する。
      # （必要スキルが埋まらないと②が学習データを作れない）
      # skill_auto_update が OFF のメンバーと、source='manual' の行は触らない。
      - name: Analyze skills (all orgs)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ steps.force.outputs.value }}
        run: |
          # ★ URL を正規化してから叩く ★
          #   APP_URL が末尾スラッシュ付き / http:// だと "//api/..." や scheme 昇格で
          #   Vercel が 308 を返す。curl は -L 無しでは追わず、-f は 3xx を失敗扱いにしないので、
          #   本文 "Redirecting..." を出すだけで exit 0 → ワークフローは緑のまま
          #   ①が一度も実行されない、という事故が実際に起きた（7/14〜7/31）。
          BASE="${APP_URL%/}"
          BASE="${BASE#http://}"; BASE="${BASE#https://}"; BASE="https://$BASE"

          RES=$(curl -sS -f -L -X POST "$BASE/api/ml/analyze-skills" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"batchId\":\"$BATCH_ID\",\"trigger\":\"$TRIGGER\",\"force\":$FORCE}")
          echo "$RES" | head -c 2000
          echo

          # ★ 応答を必ず検証する ★ 静かに素通りするくらいなら赤で落とす。
          case "$RES" in
            *'"ok":true'*) ;;
            *) echo "::error::analyze-skills が正常応答を返さなかった（リダイレクト/認証失敗の可能性）"; exit 1 ;;
          esac

          # ログを開かなくても結果が分かるように実行サマリへ出す
          {
            echo "### ① スキル分析"
            echo
            echo '```json'
            echo "$RES" | head -c 1500
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── ② モデル学習（全組織）── ①の結果を材料にする
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - run: pip install -r ml/requirements.txt pytest

      # ── 学習の直前にスモークテスト ──
      # DBには繋がず、合成データで build_dataset → fit → 評価まで通す。
      # 「毎晩無人で走り、翌朝アプリの学習ログを見るまで壊れたと分からない」構造なので、
      # 壊れたコードをそのまま本番データに当てる前にここで止める。
      - name: Smoke test (no DB)
        working-directory: ml
        run: python -m pytest -q

      - name: Train models (all orgs)
        working-directory: ml
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.org }}" ]; then ARGS="$ARGS --org ${{ github.event.inputs.org }}"; fi
          if [ "${{ steps.force.outputs.value }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python train.py $ARGS

      # ── ③ 学習ログを必ず確定させる ──
      # ★ if: always() ★ ①で落ちても、タイムアウトしても、キャンセルされても必ず通る。
      #   これが無いと、①が落ちた夜の行が「終了記録なし」のまま宙に浮き、
      #   ①がAPIに到達すらしなかった場合は行が1件も残らず、
      #   「バッチが起動しなかった日」と区別がつかなくなる。
      - name: Close batch log
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB_STATUS: ${{ job.status }}
        run: |
          BASE="${APP_URL%/}"
          BASE="${BASE#http://}"; BASE="${BASE#https://}"; BASE="https://$BASE"

          MSG="夜間バッチが途中で終了しました（GitHub Actions: $JOB_STATUS）"
          # ここ自体の失敗でワークフローの結果を塗り替えない（|| true）
          curl -sS -L -X POST "$BASE/api/ml/batch-finish" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"batchId\":\"$BATCH_ID\",\"trigger\":\"$TRIGGER\",\"status\":\"$JOB_STATUS\",\"message\":\"$MSG\"}" \
            | head -c 500 || true
          echo
