# ENHA2-034 デプロイ時の初回セットアップ
#
# ★デプロイした瞬間に、ログインの有無に関係なくサーバー側で初期セットアップを済ませる★
#   「管理者が画面を開いたら始まる」ではダメ。誰も開かなければ永久に始まらないため。
#
# main へ push（＝Vercelがデプロイ）されたら、
#   ① まだ一度も分析していない組織のスキル自動分析
#   ② モデル学習（LightGBM）
# を順に実行する。ユーザーは何もしない。次にログインしたときには終わっている。
#
# ★①は setupOnly（未セットアップの組織だけ）★
#   以前は毎デプロイで全組織を分析していた。そのため ml_last_analyzed_at が日中に進み、
#   夜間バッチが毎晩「変更なし」で空振りしていた（実測: 7/31 だけで10回デプロイ）。
#   日常の更新は ml-daily.yml の役目なので、ここは初期セットアップに徹する。
#
# 必要な Secrets:
#   APP_URL                     … 例 https://dev-ticket.vercel.app（末尾スラッシュなし）
#   CRON_SECRET                 … Vercel 側の環境変数と同じ値
#   VITE_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY

name: ML bootstrap (on deploy)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BATCH_ID: "${{ github.run_id }}-${{ github.run_attempt }}"
      TRIGGER: "deploy"
    steps:
      - uses: actions/checkout@v4

      # Vercel のデプロイが立ち上がるのを待つ（①は新デプロイのAPIを叩くため）
      - name: Wait for deployment
        run: sleep 90

      # ── ① スキル自動分析（未セットアップの組織のみ） ──
      - name: Analyze skills (new orgs only)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # ★ URL 正規化と応答検証 ★ 理由は ml-daily.yml の同じステップのコメント参照。
          #   末尾スラッシュ/http:// による 308 を curl が黙って成功扱いにする事故を防ぐ。
          BASE="${APP_URL%/}"
          BASE="${BASE#http://}"; BASE="${BASE#https://}"; BASE="https://$BASE"

          RES=$(curl -sS -f -L -X POST "$BASE/api/ml/analyze-skills" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"batchId\":\"$BATCH_ID\",\"trigger\":\"$TRIGGER\",\"setupOnly\":true}")
          echo "$RES" | head -c 2000
          echo

          case "$RES" in
            *'"ok":true'*) ;;
            *) echo "::error::analyze-skills が正常応答を返さなかった（リダイレクト/認証失敗の可能性）"; exit 1 ;;
          esac

          {
            echo "### ① スキル分析（未セットアップ組織のみ）"
            echo
            echo '```json'
            echo "$RES" | head -c 1500
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── ② モデル学習（全組織） ──
      # 完了チケットが少ない組織は学習せず、ルールベースのまま運用される（train.py 内で判定）。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - run: pip install -r ml/requirements.txt pytest

      # 学習の直前にスモークテスト（理由は ml-daily.yml と同じ）
      - name: Smoke test (no DB)
        working-directory: ml
        run: python -m pytest -q

      - name: Train models (all orgs)
        working-directory: ml
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python train.py

      # ── ③ 学習ログを必ず確定させる（理由は ml-daily.yml と同じ） ──
      - name: Close batch log
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB_STATUS: ${{ job.status }}
        run: |
          BASE="${APP_URL%/}"
          BASE="${BASE#http://}"; BASE="${BASE#https://}"; BASE="https://$BASE"

          MSG="デプロイ時バッチが途中で終了しました（GitHub Actions: $JOB_STATUS）"
          curl -sS -L -X POST "$BASE/api/ml/batch-finish" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"batchId\":\"$BATCH_ID\",\"trigger\":\"$TRIGGER\",\"status\":\"$JOB_STATUS\",\"message\":\"$MSG\"}" \
            | head -c 500 || true
          echo
